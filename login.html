<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen bg-gray-100">
        <form action="" class="bg-white p-6 rounded-xl shadow-md font-semibold">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required class="bg-gray-100 rounded">
            </div>
            <div class="mt-5">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required class="bg-gray-100 rounded">
                <label for="password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="bg-gray-100 rounded">
            </div>
            <button type="submit" class="text-white bg-cyan-500 shadow-lg shadow-cyan-500/50 px-5 py-2 mt-5 rounded-xl hover:scale-105 transition-transform duration-200 cursor-pointer">Login</button>
        </form>
    </div>
</body>
</html>
